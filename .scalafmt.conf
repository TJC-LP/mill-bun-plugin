version = "3.8.3"
runner.dialect = scala3

# Deliberately conservative: the tree mixes brace and significant-indentation styles, and this
# config normalizes spacing and wrapping without converting between them.
maxColumn = 120
rewrite.scala3.removeOptionalBraces = false
rewrite.scala3.insertEndMarkerMinLines = 0
docstrings.style = keep
newlines.source = keep
